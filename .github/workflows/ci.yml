name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Resolve Swift packages
        run: swift package resolve

      - name: Verify generated localization assets
        run: |
          node scripts/sync-system-localizations.mjs --check
          node scripts/generate-github-readmes.mjs --check
          node scripts/validate-github-localizations.mjs

      - name: Run tests
        run: swift test

      - name: Build Universal release binaries
        run: |
          swift build \
            -c release \
            --arch arm64 \
            --arch x86_64 \
            -debug-info-format none
          lipo .build/apple/Products/Release/SlimLumaApp \
            -verify_arch arm64 x86_64
          lipo .build/apple/Products/Release/slimluma \
            -verify_arch arm64 x86_64
          ! cmp -s \
            .build/apple/Products/Release/SlimLumaApp \
            .build/apple/Products/Release/slimluma
          strip -S -x \
            .build/apple/Products/Release/SlimLumaApp \
            .build/apple/Products/Release/slimluma
          scripts/verify-release-privacy.sh \
            .build/apple/Products/Release/SlimLumaApp \
            .build/apple/Products/Release/slimluma

      - name: Validate release scripts
        run: |
          zsh -n scripts/*.sh
          scripts/test-release-privacy.sh
          scripts/test-release-identity.sh
          scripts/verify-repository-privacy.sh

      - name: Reject stale localization key manifests
        run: |
          source_count="$(plutil -convert json -o - \
            Sources/SlimLuma/Resources/zh-Hans.lproj/Localizable.strings \
            | jq 'keys | length')"
          manifest_count="$(jq 'length' \
            Sources/SlimLuma/Resources/LocalizationKeys.json)"
          test "$source_count" = "$manifest_count"
